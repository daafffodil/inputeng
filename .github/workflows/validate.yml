name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r platforms/windows/scripts/requirements-test.txt
      - name: Check public tree
        run: python scripts/check_public_safety.py
      - name: Build Windows archive
        run: python platforms/windows/scripts/package.py
      - name: Validate Windows archive
        run: python platforms/windows/scripts/test_package.py
